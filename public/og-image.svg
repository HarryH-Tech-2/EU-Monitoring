<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radarGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#00ff88" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweepLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowText">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="mainClip">
      <rect x="0" y="0" width="1200" height="630" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0e14"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#00ff88" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/><line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/><line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Radar element - bottom right -->
  <g transform="translate(950, 400)">
    <circle cx="0" cy="0" r="200" fill="url(#radarGlow)"/>
    <circle cx="0" cy="0" r="180" stroke="#00ff88" stroke-width="0.5" opacity="0.12" fill="none"/>
    <circle cx="0" cy="0" r="140" stroke="#00ff88" stroke-width="0.5" opacity="0.18" fill="none"/>
    <circle cx="0" cy="0" r="100" stroke="#00ff88" stroke-width="0.5" opacity="0.25" fill="none"/>
    <circle cx="0" cy="0" r="60" stroke="#00ff88" stroke-width="0.5" opacity="0.3" fill="none"/>
    <circle cx="0" cy="0" r="20" stroke="#00ff88" stroke-width="0.5" opacity="0.4" fill="none"/>
    <!-- Cross hairs -->
    <line x1="-190" y1="0" x2="190" y2="0" stroke="#00ff88" stroke-width="0.3" opacity="0.15"/>
    <line x1="0" y1="-190" x2="0" y2="190" stroke="#00ff88" stroke-width="0.3" opacity="0.15"/>
    <!-- Sweep line -->
    <line x1="0" y1="0" x2="140" y2="-100" stroke="#00ff88" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <!-- Sweep glow area -->
    <path d="M 0 0 L 140 -100 A 172 172 0 0 0 70 -158 Z" fill="#00ff88" opacity="0.04"/>
    <!-- Blips -->
    <circle cx="80" cy="-50" r="3" fill="#00ff88" opacity="0.8" filter="url(#glow)"/>
    <circle cx="-40" cy="90" r="2.5" fill="#00ff88" opacity="0.5" filter="url(#glow)"/>
    <circle cx="110" cy="30" r="2" fill="#00ff88" opacity="0.6" filter="url(#glow)"/>
    <circle cx="-100" cy="-60" r="2" fill="#00ff88" opacity="0.35" filter="url(#glow)"/>
    <circle cx="30" cy="-120" r="2.5" fill="#00ff88" opacity="0.45" filter="url(#glow)"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#00ff88" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="3" fill="#00ff88" opacity="0.5"/>

  <!-- Corner brackets - top left -->
  <g stroke="#00ff88" stroke-width="1.5" opacity="0.4">
    <line x1="30" y1="30" x2="30" y2="55"/>
    <line x1="30" y1="30" x2="55" y2="30"/>
  </g>
  <!-- Corner brackets - top right -->
  <g stroke="#00ff88" stroke-width="1.5" opacity="0.4">
    <line x1="1170" y1="30" x2="1170" y2="55"/>
    <line x1="1170" y1="30" x2="1145" y2="30"/>
  </g>
  <!-- Corner brackets - bottom left -->
  <g stroke="#00ff88" stroke-width="1.5" opacity="0.4">
    <line x1="30" y1="600" x2="30" y2="575"/>
    <line x1="30" y1="600" x2="55" y2="600"/>
  </g>
  <!-- Corner brackets - bottom right -->
  <g stroke="#00ff88" stroke-width="1.5" opacity="0.4">
    <line x1="1170" y1="600" x2="1170" y2="575"/>
    <line x1="1170" y1="600" x2="1145" y2="600"/>
  </g>

  <!-- Top-left classification label -->
  <text x="50" y="55" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="10" fill="#00ff88" opacity="0.4" letter-spacing="3">CLASSIFICATION: UNCLASSIFIED // FOR PUBLIC RELEASE</text>

  <!-- "IS THE EU" small text above main title -->
  <text x="80" y="170" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="22" fill="#00ff88" opacity="0.6" letter-spacing="6">IS THE EU</text>

  <!-- Main title: MONITORING -->
  <text x="75" y="250" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="90" font-weight="bold" fill="#00ff88" filter="url(#glowStrong)" letter-spacing="4">MONITORING</text>

  <!-- THE SITUATION? -->
  <text x="80" y="310" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="40" fill="#00ff88" opacity="0.7" letter-spacing="8">THE SITUATION?</text>

  <!-- Divider line -->
  <line x1="80" y1="340" x2="700" y2="340" stroke="#00ff88" stroke-width="1" opacity="0.25"/>

  <!-- Status indicators row -->
  <g transform="translate(80, 380)">
    <!-- Status LED -->
    <circle cx="8" cy="0" r="5" fill="#00ff88" filter="url(#glow)"/>
    <text x="22" y="5" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="16" fill="#00ff88" opacity="0.9" letter-spacing="2">OPERATIONAL STATUS: ACTIVE</text>
  </g>

  <g transform="translate(80, 415)">
    <circle cx="8" cy="0" r="5" fill="#ffb347" filter="url(#glow)"/>
    <text x="22" y="5" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="16" fill="#ffb347" opacity="0.9" letter-spacing="2">THREAT LEVEL: ELEVATED</text>
  </g>

  <g transform="translate(80, 450)">
    <circle cx="8" cy="0" r="5" fill="#00d4ff" filter="url(#glow)"/>
    <text x="22" y="5" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="16" fill="#00d4ff" opacity="0.9" letter-spacing="2">CONCERN INDEX: 73/100</text>
  </g>

  <!-- Live feed area -->
  <g transform="translate(80, 495)">
    <rect x="0" y="0" width="520" height="32" rx="2" fill="#0f1419" stroke="#1a2530" stroke-width="1"/>
    <circle cx="16" cy="16" r="3" fill="#ff4444" opacity="0.8"/>
    <text x="28" y="21" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" fill="#888888" letter-spacing="1">LIVE FEED: Monitoring intensity remains at projected levels...</text>
  </g>

  <!-- Bottom bar with URL -->
  <rect x="0" y="575" width="1200" height="55" fill="#0f1419" opacity="0.8"/>
  <line x1="0" y1="575" x2="1200" y2="575" stroke="#1a2530" stroke-width="1"/>
  <text x="80" y="608" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="14" fill="#00ff88" opacity="0.5" letter-spacing="2">istheeumonitoringthesituation.com</text>

  <!-- Bottom right corner data -->
  <text x="1000" y="600" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="10" fill="#555555" letter-spacing="1" text-anchor="end">SYS.REF: EU-MON-2024</text>
  <text x="1000" y="615" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="10" fill="#555555" letter-spacing="1" text-anchor="end">FREQ: CONTINUOUS</text>

  <!-- Scan lines effect overlay -->
  <g opacity="0.02">
    <line x1="0" y1="1" x2="1200" y2="1" stroke="white" stroke-width="1"/>
    <line x1="0" y1="5" x2="1200" y2="5" stroke="white" stroke-width="1"/>
    <line x1="0" y1="9" x2="1200" y2="9" stroke="white" stroke-width="1"/>
    <line x1="0" y1="13" x2="1200" y2="13" stroke="white" stroke-width="1"/>
    <line x1="0" y1="17" x2="1200" y2="17" stroke="white" stroke-width="1"/>
    <line x1="0" y1="21" x2="1200" y2="21" stroke="white" stroke-width="1"/>
  </g>

  <!-- Outer border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#1a2530" stroke-width="2"/>
</svg>
